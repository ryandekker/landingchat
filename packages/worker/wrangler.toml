name = "landingchat-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Use the Workers Paid plan for higher limits
# workers_dev = true

# For production deployment
# route = "landingchat.example.com/*"
# zone_id = "your-zone-id"

# Environment variables (secrets should be set via `wrangler secret put`)
# All secrets and sensitive values should be set using:
# wrangler secret put <KEY_NAME>
#
# Example:
# wrangler secret put LLM_API_KEY
# wrangler secret put OPENSEARCH_PASSWORD
# wrangler secret put AWS_SECRET_ACCESS_KEY

[vars]
# Non-sensitive environment variables can be defined here
# LLM_BASE_MODEL = "claude-3-haiku-20240307"
# LLM_HEAVY_MODEL = "claude-3-sonnet-20240229"
# LLM_API_URL = "https://api.anthropic.com/v1/messages"
# OPENSEARCH_APPS_INDEX = "apps_catalog"
# AWS_REGION = "us-east-1"
# DDB_TABLE_SESSIONS = "landingchat-sessions"
# DDB_TABLE_MESSAGES = "landingchat-messages"
# ALLOWED_ORIGINS = "http://localhost:5173,https://your-domain.com"

# For development, you can use .dev.vars file instead
# See .dev.vars.example for template

[build]
command = "pnpm build"

# Enable Node.js compatibility for AWS SDK
# compatibility_flags = ["nodejs_compat"]

# Or use the compatibility flag in the newer format:
# node_compat = true
